name: Validate agent package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Validate Claude plugin
        run: npx --yes @anthropic-ai/claude-code plugin validate . --strict

  ci-success:
    name: ci-success
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required checks passed
        run: test "${{ needs.validate.result }}" = "success"
